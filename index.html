<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeGa.id - Smart Lele Galon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9',
                        danger: '#ef4444',
                        success: '#22c55e',
                    }
                }
            }
        }
    </script>
    <style>
        select::-webkit-scrollbar { display: none; }
        select { -ms-overflow-style: none; scrollbar-width: none; -webkit-appearance: none; -moz-appearance: none; text-indent: 1px; text-overflow: ''; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased p-4 md:p-8">

    <!-- HEADER -->
    <header class="bg-white rounded-2xl shadow-sm p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-center md:text-left">
            <div id="date-display" class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Memuat tanggal...</div>
            <div id="clock-display" class="text-3xl font-bold text-slate-800 flex items-center justify-center md:justify-start gap-2">
                <i class="fa-regular fa-clock text-primary"></i> <span>00:00:00</span>
            </div>
        </div>

        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-slate-800 mb-1">Smart <span class="text-primary">Lele Galon</span></h1>
            <div class="flex items-center justify-center gap-2 text-sm font-medium">
                Status Cloud:
                <span id="cloud-status" class="px-3 py-1 rounded-full bg-red-100 text-red-600 flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div> Terputus
                </span>
            </div>
        </div>

        <div class="bg-primary/10 rounded-xl p-4 text-center min-w-[150px]">
            <i class="fa-solid fa-sack-xmark text-primary text-2xl mb-1"></i>
            <div class="text-sm font-bold text-slate-600">Level Pakan</div>
            <div id="level-pakan" class="text-2xl font-black text-primary">--%</div>
        </div>
    </header>

    <!-- KONTEN KOLAM -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

        <!-- Kolam 1 -->
        <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 hover:shadow-lg transition">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-slate-800">Kolam 1</h2>
                <span id="status-kolam-1" class="text-sm font-bold px-3 py-1 bg-blue-100 text-blue-700 rounded-lg">Aman</span>
            </div>
            
            <div class="mb-6">
                <div class="flex justify-between text-sm mb-1 font-semibold text-slate-600">
                    <span>Level Air</span>
                    <span id="level-air-1" class="text-primary">--%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-3">
                    <div id="bar-air-1" class="bg-primary h-3 rounded-full" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl mb-6 border border-slate-200">
                <h3 class="text-sm font-bold text-slate-500 mb-3 uppercase tracking-wider text-center">Kontrol Manual</h3>
                <div class="flex justify-between items-center gap-2">
                    <label class="flex flex-col items-center cursor-pointer">
                        <span class="text-xs font-semibold mb-2">Air Masuk</span>
                        <div class="relative w-14 h-7">
                            <input type="checkbox" class="sr-only peer action-toggle" data-kolam="1" data-action="air_masuk">
                            <div class="w-full h-full bg-slate-300 rounded-full peer-checked:bg-success transition-colors duration-300"></div>
                            <span class="absolute right-2 top-1.5 text-[10px] font-extrabold text-slate-500 peer-checked:opacity-0 transition-opacity duration-300 pointer-events-none">OFF</span>
                            <span class="absolute left-2 top-1.5 text-[10px] font-extrabold text-white opacity-0 peer-checked:opacity-100 transition-opacity duration-300 pointer-events-none">ON</span>
                            <div class="absolute top-1 left-1 bg-white w-5 h-5 rounded-full shadow-sm transition-transform duration-300 peer-checked:translate-x-7 pointer-events-none"></div>
                        </div>
                    </label>
                    <label class="flex flex-col items-center cursor-pointer">
                        <span class="text-xs font-semibold mb-2">Air Keluar</span>
                        <div class="relative w-14 h-7">
                            <input type="checkbox" class="sr-only peer action-toggle" data-kolam="1" data-action="air_keluar">
                            <div class="w-full h-full bg-slate-300 rounded-full peer-checked:bg-danger transition-colors duration-300"></div>
                            <span class="absolute right-2 top-1.5 text-[10px] font-extrabold text-slate-500 peer-checked:opacity-0 transition-opacity duration-300 pointer-events-none">OFF</span>
                            <span class="absolute left-2 top-1.5 text-[10px] font-extrabold text-white opacity-0 peer-checked:opacity-100 transition-opacity duration-300 pointer-events-none">ON</span>
                            <div class="absolute top-1 left-1 bg-white w-5 h-5 rounded-full shadow-sm transition-transform duration-300 peer-checked:translate-x-7 pointer-events-none"></div>
                        </div>
                    </label>
                    <label class="flex flex-col items-center cursor-pointer">
                        <span class="text-xs font-semibold mb-2">Pakan</span>
                        <div class="relative w-14 h-7">
                            <input type="checkbox" class="sr-only peer pakan-toggle action-toggle" data-kolam="1" data-action="pakan">
                            <div class="w-full h-full bg-slate-300 rounded-full peer-checked:bg-amber-500 transition-colors duration-300"></div>
                            <span class="absolute right-2 top-1.5 text-[10px] font-extrabold text-slate-500 peer-checked:opacity-0 transition-opacity duration-300 pointer-events-none">OFF</span>
                            <span class="absolute left-2 top-1.5 text-[10px] font-extrabold text-white opacity-0 peer-checked:opacity-100 transition-opacity duration-300 pointer-events-none">ON</span>
                            <div class="absolute top-1 left-1 bg-white w-5 h-5 rounded-full shadow-sm transition-transform duration-300 peer-checked:translate-x-7 pointer-events-none"></div>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <h3 class="text-sm font-bold text-slate-500 mb-2 uppercase tracking-wider"><i class="fa-regular fa-calendar-check mr-1"></i> Jadwal Pakan</h3>
                <div class="space-y-2 mb-4 text-sm">
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg">
                        <span>Jadwal 1</span>
                        <div class="custom-scroll-picker flex items-center justify-center border rounded bg-white w-24 h-8 cursor-pointer" data-default="06:25"></div>
                        <input type="checkbox" class="w-4 h-4 accent-primary cursor-pointer jadwal-aktif" data-kolam="1" data-jadwal="1">
                    </div>
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg">
                        <span>Jadwal 2</span>
                        <div class="custom-scroll-picker flex items-center justify-center border rounded bg-white w-24 h-8 cursor-pointer" data-default="12:30"></div>
                        <input type="checkbox" class="w-4 h-4 accent-primary cursor-pointer jadwal-aktif" data-kolam="1" data-jadwal="2">
                    </div>
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg">
                        <span>Jadwal 3</span>
                        <div class="custom-scroll-picker flex items-center justify-center border rounded bg-white w-24 h-8 cursor-pointer" data-default="17:30"></div>
                        <input type="checkbox" class="w-4 h-4 accent-primary cursor-pointer jadwal-aktif" data-kolam="1" data-jadwal="3">
                    </div>
                </div>
                <button onclick="simpanJadwal(1)" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Jadwal
                </button>
            </div>
        </div>

        <!-- Kolam 2 (sama seperti Kolam 1, hanya ganti id) -->
        <div class="bg-white rounded-2xl shadow-md p-6 border-2 border-danger/20 hover:shadow-lg transition relative overflow-hidden">
            <!-- ... sama seperti Kolam 1, dengan id kolam=2, status-kolam-2, level-air-2, bar-air-2, dsb -->
            <!-- Untuk ringkas, salin struktur kolam 1 dan ubah semua data-kolam menjadi 2, id unik menjadi ...-2 -->
        </div>

        <!-- Kolam 3 -->
        <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 hover:shadow-lg transition">
            <!-- ... sama seperti Kolam 1, dengan id kolam=3 -->
        </div>
    </div>

    <!-- LIVE ACTIVITY LOG -->
    <section class="bg-white rounded-2xl shadow-md p-6 border border-slate-100">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-primary"></i> Live Activity Log
            </h2>
            <button onclick="clearLogs()" class="text-xs bg-slate-200 hover:bg-red-100 hover:text-red-600 font-semibold px-3 py-1.5 rounded-lg transition-colors">
                <i class="fa-solid fa-trash-can mr-1"></i> Bersihkan Log
            </button>
        </div>
        <div id="log-container" class="bg-slate-900 text-slate-200 font-mono text-xs p-4 rounded-xl h-40 overflow-y-auto space-y-2">
            <div class="text-slate-500 italic">[Sistem siap merekam aktivitas...]</div>
        </div>
    </section>

    <script>
        // ===================== KONFIGURASI MQTT (HiveMQ Cloud) =====================
        const MQTT_HOST = '15bd2c53c9fd47e5a4502e8d9c51bc80.s1.eu.hivemq.cloud';
        const MQTT_PORT = 8884; // WebSocket Secure
        const MQTT_USER = 'LeGaTech.id';
        const MQTT_PASS = 'LeleGalon2026';

        // ===================== INISIALISASI MQTT =====================
        const mqttClient = mqtt.connect(`wss://${MQTT_HOST}:${MQTT_PORT}/mqtt`, {
            username: MQTT_USER,
            password: MQTT_PASS
        });

        const statusElement = document.getElementById('cloud-status');

        mqttClient.on('connect', () => {
            console.log('Terhubung ke HiveMQ Cloud');
            statusElement.className = "px-3 py-1 rounded-full bg-green-100 text-green-700 flex items-center gap-2";
            statusElement.innerHTML = `<div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> Terhubung`;
            addLog('Terhubung ke Cloud MQTT', 'info');

            // Subscribe topik sensor
            mqttClient.subscribe('lega/kolam/+/sensor');
            mqttClient.subscribe('lega/pakan/level');
        });

        mqttClient.on('error', (err) => {
            console.error('MQTT Error:', err);
            statusElement.className = "px-3 py-1 rounded-full bg-red-100 text-red-600 flex items-center gap-2";
            statusElement.innerHTML = `<div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div> Terputus`;
            addLog('Koneksi ke Cloud MQTT terputus', 'error');
        });

        mqttClient.on('message', (topic, message) => {
            const payload = message.toString();
            console.log(`Pesan dari ${topic}:`, payload);

            if (topic.startsWith('lega/kolam/')) {
                const kolamId = topic.split('/')[2];
                try {
                    const data = JSON.parse(payload);
                    updateKolam(kolamId, data);
                } catch (e) {
                    console.error('Gagal parse JSON sensor:', e);
                }
            } else if (topic === 'lega/pakan/level') {
                document.getElementById('level-pakan').textContent = payload + '%';
            }
        });

        // ===================== FUNGSI UPDATE UI =====================
        function updateKolam(id, data) {
            const levelAir = data.air_level || 0;
            document.getElementById(`level-air-${id}`).textContent = levelAir + '%';
            document.getElementById(`bar-air-${id}`).style.width = levelAir + '%';

            // Status aman/kritis
            const statusElem = document.getElementById(`status-kolam-${id}`);
            if (levelAir < 30) {
                statusElem.className = "text-sm font-bold px-3 py-1 bg-red-100 text-red-700 rounded-lg animate-pulse";
                statusElem.textContent = 'Kritis!';
            } else {
                statusElem.className = "text-sm font-bold px-3 py-1 bg-blue-100 text-blue-700 rounded-lg";
                statusElem.textContent = 'Aman';
            }

            // Update toggle switches sesuai status relay
            const toggles = document.querySelectorAll(`.action-toggle[data-kolam="${id}"]`);
            toggles.forEach(toggle => {
                const action = toggle.dataset.action;
                if (action === 'air_masuk') toggle.checked = data.air_masuk || false;
                if (action === 'air_keluar') toggle.checked = data.air_keluar || false;
                if (action === 'pakan') toggle.checked = false; // pakan selalu kembali off
            });
        }

        // ===================== KONTROL MANUAL =====================
        document.querySelectorAll('.action-toggle').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const kolam = this.dataset.kolam;
                const action = this.dataset.action;
                const state = this.checked ? 1 : 0;

                // Kirim perintah MQTT
                const topic = `lega/kolam/${kolam}/control`;
                const payload = JSON.stringify({ action, state });
                mqttClient.publish(topic, payload);

                // Log
                addLog(`Kolam ${kolam} -> ${action} diubah ke ${state ? 'ON' : 'OFF'}`, 'action');

                // Jika pakan, otomatis off setelah 1 detik
                if (action === 'pakan' && state === 1) {
                    setTimeout(() => {
                        this.checked = false;
                    }, 1000);
                }
            });
        });

        // ===================== JADWAL PAKAN =====================
        // Inisialisasi scroll picker
        document.querySelectorAll('.custom-scroll-picker').forEach(container => {
            const defaultTime = container.getAttribute('data-default');
            const [defHour, defMin] = defaultTime.split(':');

            const selHour = document.createElement('select');
            selHour.className = "bg-transparent outline-none text-center cursor-pointer font-bold text-slate-700 text-sm hover:text-primary transition-colors w-10";
            for(let i = 0; i < 24; i++) {
                let val = String(i).padStart(2, '0');
                let opt = new Option(val, val);
                if(val === defHour) opt.selected = true;
                selHour.add(opt);
            }

            const span = document.createElement('span');
            span.textContent = ':';
            span.className = "font-bold text-slate-400 -mt-0.5";

            const selMin = document.createElement('select');
            selMin.className = "bg-transparent outline-none text-center cursor-pointer font-bold text-slate-700 text-sm hover:text-primary transition-colors w-10";
            for(let i = 0; i < 60; i++) {
                let val = String(i).padStart(2, '0');
                let opt = new Option(val, val);
                if(val === defMin) opt.selected = true;
                selMin.add(opt);
            }

            container.appendChild(selHour);
            container.appendChild(span);
            container.appendChild(selMin);
        });

        function simpanJadwal(kolamId) {
            const kolamCard = document.querySelectorAll('.grid > div')[kolamId - 1];
            const pickers = kolamCard.querySelectorAll('.custom-scroll-picker');
            const checkboxes = kolamCard.querySelectorAll('.jadwal-aktif');

            let jadwal = {};
            pickers.forEach((picker, index) => {
                const selects = picker.querySelectorAll('select');
                const jam = selects[0].value;
                const menit = selects[1].value;
                const aktif = checkboxes[index].checked;
                jadwal[`jadwal${index+1}`] = { jam, menit, aktif };
            });

            const topic = `lega/kolam/${kolamId}/jadwal`;
            const payload = JSON.stringify(jadwal);
            mqttClient.publish(topic, payload);

            addLog(`Jadwal Pakan Kolam ${kolamId} diperbarui`, 'schedule');
            alert(`Jadwal Pakan untuk Kolam ${kolamId} berhasil disimpan!`);
        }

        // ===================== LOG =====================
        function getCurrentTimeStamp() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('log-container');
            if (logContainer.querySelector('.italic')) {
                logContainer.innerHTML = '';
            }
            const timeStamp = getCurrentTimeStamp();
            const logItem = document.createElement('div');
            let colorClass = 'text-green-400';
            if (type === 'action') colorClass = 'text-sky-400';
            if (type === 'schedule') colorClass = 'text-amber-400';
            logItem.className = `flex items-center gap-2 border-b border-slate-800 pb-1`;
            logItem.innerHTML = `<span class="text-slate-500">[${timeStamp}]</span> <span class="${colorClass}">${message}</span>`;
            logContainer.prepend(logItem);
        }

        function clearLogs() {
            document.getElementById('log-container').innerHTML = '<div class="text-slate-500 italic">[Log dibersihkan oleh pengguna]</div>';
        }

        // ===================== JAM REAL-TIME =====================
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.querySelector('#clock-display span').textContent = `${h}:${m}:${s}`;
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: '2-digit' };
            document.getElementById('date-display').textContent = now.toLocaleDateString('id-ID', options);
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
